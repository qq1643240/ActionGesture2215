name: Build RootHide arm64e deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@main
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/theos/theos.git
          theos-sdks: https://github.com/theos/sdks

      - name: Build RootHide arm64e package
        run: make package FINALPACKAGE=1

      - name: Verify package architecture
        run: |
          set -eu
          deb=$(find packages -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb -f "$deb" Architecture
          dpkg-deb -f "$deb" Name Version

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionGesture2215-arm64e
          path: packages/*arm64e.deb
          if-no-files-found: error
