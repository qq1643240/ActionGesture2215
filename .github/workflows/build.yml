name: Build RootHide arm64e deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare RootHide Theos
        uses: huami1314/theos-action@main

      - name: Build RootHide arm64e package
        run: |
          chmod 755 layout/DEBIAN/prerm
          make package FINALPACKAGE=1

      - name: Verify arm64e package exists
        run: |
          set -eu
          deb=$(find packages -maxdepth 1 -name '*arm64e.deb' -print -quit)
          test -n "$deb"
          echo "Built: $deb"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionGesture2215-arm64e
          path: packages/*arm64e.deb
          if-no-files-found: error

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.29
          name: ActionGesture2215 v2.2.29 RootHide arm64e
          prerelease: false
          files: packages/*arm64e.deb
